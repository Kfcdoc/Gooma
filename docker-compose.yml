# ---------------------------------------------------------------------------
# GooMaps — orquestación de desarrollo
#
#   docker compose up --build
#
# Servicios:
#   mongo      MongoDB 8 como replica set de un nodo (transacciones)
#   mongo-init Inicializa rs0 de forma idempotente y termina
#   backend    Laravel 13 (API REST en /api/v1)
#   frontend   React + Vite + TypeScript
# ---------------------------------------------------------------------------
name: goomaps

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      # 27019 evita chocar con instalaciones locales de MongoDB (27017/27018).
      # Dentro de la red de Compose Mongo siempre escucha en 27017.
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
    volumes:
      - ./docker/mongo/init-replica.sh:/scripts/init-replica.sh:ro
    entrypoint: ["bash", "/scripts/init-replica.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      APP_TIMEZONE: America/Mexico_City
      DB_CONNECTION: mongodb
      DB_HOST: mongo
      DB_PORT: 27017
      DB_DATABASE: "${MONGO_DATABASE:-goomaps}"
      # Divisas (fase 4): API pública y respaldo configurable
      FX_API_URL: "${FX_API_URL:-https://api.frankfurter.app}"
      FX_CACHE_TTL: "${FX_CACHE_TTL:-43200}"
      FX_FALLBACK_USD: "${FX_FALLBACK_USD:-17.50}"
      FX_FALLBACK_EUR: "${FX_FALLBACK_EUR:-19.00}"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["bash", "/usr/local/bin/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    init: true
    tty: true

volumes:
  mongo_data:
  backend_vendor:
  frontend_node_modules:
